[package]
name = "mixfeedd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mixfeed-audio = { version = "0.1.0", path = "../../crates/mixfeed-audio" }
mixfeed-cam = { version = "0.1.0", path = "../../crates/mixfeed-cam" }
mixfeed-ctl = { version = "0.1.0", path = "../../crates/mixfeed-ctl" }
mixfeed-ndi = { version = "0.1.0", path = "../../crates/mixfeed-ndi" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_50"] }
